[project]
name = "bundle-code"
version = "0.1.0"
description = "Copy a folder with an ignore file and write commit metadata"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
bundle-code = "bundle_code.cli:main"

[tool.setuptools]
packages = ["bundle_code"]
